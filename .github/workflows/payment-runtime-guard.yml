name: Payment Runtime Guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  payment-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse payment runtime
        run: |
          node --check checkout-receipts.js
          node --check portal-runtime-loader.js
          node --check payment-center.js
      - name: Verify single runtime ownership
        run: |
          node <<'NODE'
          const fs = require('fs');
          const loader = fs.readFileSync('portal-runtime-loader.js','utf8');
          const index = fs.readFileSync('index.html','utf8');
          const banned = ['leads.js','intake-modal-release.js','sales-ops-bootstrap.js'];
          for (const file of banned) {
            if (loader.includes(`'${file}'`) || loader.includes(`"${file}"`)) throw new Error(`${file} must not be loaded by the production runtime`);
            if (fs.existsSync(file)) throw new Error(`${file} is retired and must not remain in the repository`);
          }
          for (const css of ['intake-modal-release.css','sales-ops.css','checkout-receipts.css']) {
            if (!index.includes(css)) throw new Error(`${css} must be owned by index.html`);
          }
          console.log('Runtime ownership is consolidated.');
          NODE
      - name: Verify reconciled checkout contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const checkout = fs.readFileSync('checkout-receipts.js','utf8');
          const migration47 = fs.readFileSync('supabase/migrations/0047_payment_reconciliation_and_checkout_balance.sql','utf8');
          const migration48 = fs.readFileSync('supabase/migrations/0048_checkout_controlled_status_transition.sql','utf8');
          const requiredCheckout = [
            "get_checkout_payment_summary",
            "prepayment_amount_cents",
            "balance_due_cents",
            "paid_amount_cents:balance",
            "Remaining balance",
            "overpayment"
          ];
          for (const token of requiredCheckout) if (!checkout.includes(token)) throw new Error(`Checkout reconciliation token missing: ${token}`);
          const requiredSql = [
            "create or replace function public.get_checkout_payment_summary",
            "prepayment_amount_cents",
            "checkout_amount_cents",
            "Checkout amount must equal the remaining balance after verified prepayment."
          ];
          for (const token of requiredSql) if (!migration47.includes(token) && !migration48.includes(token)) throw new Error(`Payment SQL contract missing: ${token}`);
          if (!migration48.includes("set_config('app.repair_status_advance','allowed',true)")) throw new Error('Checkout must use the controlled repair status transition context');
          if (!migration48.includes("Verified prepayment exceeds the final work-order total")) throw new Error('Overpayment must block Sale Complete');
          console.log('Payment reconciliation contract is present.');
          NODE
