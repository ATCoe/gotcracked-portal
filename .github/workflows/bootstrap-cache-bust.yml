name: One-time bootstrap cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-cache-bust.yml'

permissions:
  contents: write

jobs:
  bump-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force current Portal bootstrap asset URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('?v=20260825-release19', '?v=20260826-release34')
          s = s.replace('?v=20260825-release20', '?v=20260826-release34')
          p.write_text(s)
          PY
      - name: Commit bootstrap cache bust
        run: |
          if git diff --quiet -- index.html; then
            echo 'No bootstrap changes needed.'
            exit 0
          fi
          git config user.name 'GotCracked CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Force mobile Portal onto release34 bootstrap'
          git push
