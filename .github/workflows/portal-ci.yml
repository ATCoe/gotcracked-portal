name: Portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: CSS and local reference integrity
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in Path('.').glob('*.css'):
              text = path.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {path}')

          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
          missing = []
          for ref in refs:
              ref = ref.split('?', 1)[0].split('#', 1)[0]
              if not ref or ref.startswith(('http://','https://','mailto:','tel:','#')):
                  continue
              if not Path(ref).exists():
                  missing.append(ref)
          if missing:
              raise SystemExit('Missing local references: ' + ', '.join(sorted(set(missing))))

      - name: Portal 1.0 architecture invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          release = Path('portal-v1-release.css').read_text(encoding='utf-8')
          mobile = Path('mobile-nav-safe.js').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          final_js = Path('portal-v1-final.js').read_text(encoding='utf-8')
          runtime = Path('portal-runtime-loader.js').read_text(encoding='utf-8')
          operations = Path('operations-v1-core.js').read_text(encoding='utf-8')
          directory = Path('master-directory.js').read_text(encoding='utf-8')
          sales = Path('sales-ops.js').read_text(encoding='utf-8')
          sales_css = Path('sales-ops.css').read_text(encoding='utf-8')
          supabase_js = Path('supabase.js').read_text(encoding='utf-8')
          migration = Path('supabase/migrations/0011_portal_realtime_publication.sql').read_text(encoding='utf-8')

          if re.search(r'<style(?:\s|>)', html, re.I):
              raise SystemExit('Inline <style> blocks are forbidden in index.html; use the release cascade.')

          css_refs = re.findall(r'<link[^>]+rel=["\']stylesheet["\'][^>]+href=["\']([^"\']+)', html, re.I)
          css_files = [ref.split('?',1)[0] for ref in css_refs]
          required_order = [
              'styles.css', 'workflow.css', 'complete.css', 'auth-modern.css',
              'workforce.css', 'hardening.css', 'operations-v1.css',
              'operations-v1-extra.css', 'portal-v1-polish.css',
              'master-directory.css', 'portal-v1-release.css'
          ]
          positions = []
          for name in required_order:
              if name not in css_files:
                  raise SystemExit(f'Missing required stylesheet: {name}')
              positions.append(css_files.index(name))
          if positions != sorted(positions):
              raise SystemExit('Portal stylesheet order changed; release cascade is no longer deterministic.')
          if css_files[-1] != 'portal-v1-release.css':
              raise SystemExit('portal-v1-release.css must be the final stylesheet in index.html.')

          if "overflow-y:auto" in mobile.replace(' ', ''):
              raise SystemExit('Mobile left navigation must not be vertically scrollable.')
          if "createElement('style')" in mobile or 'createElement("style")' in mobile:
              raise SystemExit('mobile-nav-safe.js must not inject CSS.')
          if 'MutationObserver' in mobile:
              raise SystemExit('Mobile hamburger controller must not use MutationObserver.')
          if 'mobileMenu?.addEventListener' in app or "document.querySelector('.mobile-menu')" in app:
              raise SystemExit('app.js must not own the hamburger; mobile-nav-safe.js is the sole controller.')
          if "classList.toggle('mobile-nav-open'" in app or 'classList.toggle("mobile-nav-open"' in app:
              raise SystemExit('app.js must not restore the legacy body-lock mobile state.')
          if 'sidebarBackdrop' in app or "createElement('button')" in app and 'sidebar-backdrop' in app:
              raise SystemExit('app.js must not recreate the retired full-screen mobile backdrop.')
          if 'hardening.css' in app:
              raise SystemExit('app.js must not dynamically inject hardening.css.')
          if 'window.GotCrackedDiagnostics = diagnostics' not in app or 'unhandledrejection' not in app:
              raise SystemExit('Global live diagnostics must remain available.')
          if '.gc-diagnostic-stack' not in release or 'data-gc-copy-diagnostic' not in app:
              raise SystemExit('Diagnostic toast UI or copyable reference is missing.')

          if 'attributes: true' in final_js or "attributeFilter: ['class'" in final_js:
              raise SystemExit('portal-v1-final.js must not globally observe class/attribute mutations.')
          if 'childList: true' not in final_js:
              raise SystemExit('portal-v1-final.js should observe inserted operational DOM only.')

          script_refs = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)
          script_files = [ref.split('?',1)[0] for ref in script_refs]
          critical = ['supabase.js','discord-integration.js','workflow.js','app.js','mobile-nav-safe.js','portal-runtime-loader.js']
          for name in critical:
              if name not in script_files:
                  raise SystemExit(f'Missing critical shell script: {name}')
          heavy = ['leads.js','portal-live.js','workforce.js','analytics.js','shipping.js','inventory-audit.js','operations-v1-core.js']
          leaked = [name for name in heavy if name in script_files]
          if leaked:
              raise SystemExit('Heavy operational scripts must load after authentication: ' + ', '.join(leaked))

          required_runtime = [
              'leads.js','portal-live.js','workforce.js','analytics.js','shipping.js','inventory-audit.js',
              'operations-v1-core.js','training-store-guard.js','operations-v1-arrival.js',
              'portal-v1-polish.js','portal-v1-final.js','master-directory.js'
          ]
          for name in required_runtime:
              if name not in runtime:
                  raise SystemExit(f'Authenticated runtime loader missing: {name}')

          required_release_fragments = [
              '.sidebar.gc-mobile-nav-ready>nav:not(.gc-mobile-nav)',
              '.sidebar>.gc-mobile-nav',
              '.sidebar-backdrop{display:none!important}',
              '.v1-drawer-backdrop',
              'background:transparent!important',
              '.v1-workflow-panel',
              'body.v1-overlay-open,body.v1-workflow-open',
              '#dashboard>.v1-dashboard-grid{display:none!important}',
              '.page-heading .subtle{display:none!important}',
              '.gc-dir-head p:not(.eyebrow){display:none!important}'
          ]
          for fragment in required_release_fragments:
              if fragment not in release:
                  raise SystemExit(f'Release CSS invariant missing: {fragment}')

          realtime_tables = ['leads','repair_tickets','customers','devices','intake_sessions','work_order_items','ticket_events']
          for table in realtime_tables:
              if table not in operations or table not in migration:
                  raise SystemExit(f'Cross-user realtime coverage missing for {table}.')
          if 'queueRealtimeReload' not in operations or 'realtimeReloading' not in operations:
              raise SystemExit('Operational realtime refresh must remain debounced and single-flight.')
          if 'client.realtime.setAuth(persisted.access_token)' not in supabase_js:
              raise SystemExit('Storage-first auth restore must pass its token to Realtime.')
          if 'await client.realtime.setAuth(session.access_token)' not in operations:
              raise SystemExit('Realtime subscription must authenticate before channel join.')
          if 'setInterval' not in operations or 'visibilitychange' not in operations:
              raise SystemExit('Realtime must retain an authoritative refresh fallback.')
          if 'first_name?.trim()&&x.newCustomer.phone?.trim()' not in operations:
              raise SystemExit('Walk-in intake must require only customer name and phone.')
          for status_class in ['status-red','status-yellow','status-green','status-blue']:
              if status_class not in directory:
                  raise SystemExit(f'Master Directory status mapping missing {status_class}.')
          if 'linear-gradient(90deg,#d63b36' not in sales_css or 'is-over-goal .gc-sales-progress>span' not in sales_css:
              raise SystemExit('Compact red-to-green sales goal bar invariant missing.')
          if 'gc-sales-goal-marker' not in sales:
              raise SystemExit('Sales goal progress markup missing.')

          print('Portal 1.0 architecture checks passed.')

