name: Portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: CSS and local reference integrity
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in Path('.').glob('*.css'):
              text = path.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {path}')

          for page in ['index.html', 'schedule-print.html']:
              html = Path(page).read_text(encoding='utf-8')
              refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
              missing = []
              for ref in refs:
                  ref = ref.split('?', 1)[0].split('#', 1)[0]
                  if not ref or ref.startswith(('http://','https://','mailto:','tel:','#')):
                      continue
                  if not Path(ref).exists():
                      missing.append(ref)
              if missing:
                  raise SystemExit(f'Missing local references in {page}: ' + ', '.join(sorted(set(missing))))

      - name: Portal v1.1 architecture invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          release = Path('portal-v1-release.css').read_text(encoding='utf-8')
          mobile = Path('mobile-nav-safe.js').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          final_js = Path('portal-v1-final.js').read_text(encoding='utf-8')
          runtime = Path('portal-runtime-loader.js').read_text(encoding='utf-8')
          operations = Path('operations-v1-core.js').read_text(encoding='utf-8')
          intake_profile = Path('intake-profile-validation-fix.js').read_text(encoding='utf-8')
          directory = Path('master-directory.js').read_text(encoding='utf-8')
          sales = Path('sales-ops.js').read_text(encoding='utf-8')
          sales_css = Path('sales-ops.css').read_text(encoding='utf-8')
          supabase_js = Path('supabase.js').read_text(encoding='utf-8')
          schedule = Path('schedule-board.js').read_text(encoding='utf-8')
          schedule_print = Path('schedule-print.js').read_text(encoding='utf-8')
          schedule_print_page = Path('schedule-print-page.js').read_text(encoding='utf-8')
          schedule_print_css = Path('schedule-print.css').read_text(encoding='utf-8')
          timeclock = Path('time-clock.js').read_text(encoding='utf-8')
          theme_bootstrap = Path('theme-bootstrap.js').read_text(encoding='utf-8')
          migration = Path('supabase/migrations/0011_portal_realtime_publication.sql').read_text(encoding='utf-8')

          if re.search(r'<style(?:\s|>)', html, re.I):
              raise SystemExit('Inline <style> blocks are forbidden in index.html; use the release cascade.')

          css_refs = re.findall(r'<link[^>]+rel=["\']stylesheet["\'][^>]+href=["\']([^"\']+)', html, re.I)
          css_files = [ref.split('?',1)[0] for ref in css_refs]
          required_order = [
              'styles.css', 'workflow.css', 'complete.css', 'auth-modern.css',
              'workforce.css', 'hardening.css', 'operations-v1.css',
              'operations-v1-extra.css', 'portal-v1-polish.css',
              'master-directory.css', 'portal-v1-release.css',
              'portal-theme.css', 'portal-dark-components.css', 'theme-switch.css',
              'intake-modal-release.css', 'sales-ops.css', 'checkout-receipts.css',
              'schedule-board.css', 'time-clock.css'
          ]
          positions = []
          for name in required_order:
              if name not in css_files:
                  raise SystemExit(f'Missing required stylesheet: {name}')
              positions.append(css_files.index(name))
          if positions != sorted(positions):
              raise SystemExit('Portal stylesheet order changed; first-paint cascade is no longer deterministic.')
          if css_files[-1] != 'time-clock.css':
              raise SystemExit('time-clock.css must remain the final first-paint component stylesheet.')
          if html.index('theme-bootstrap.js') > html.index('styles.css'):
              raise SystemExit('Theme bootstrap must run before the first stylesheet paints.')
          for name in ['portal-theme.css','portal-dark-components.css','theme-switch.css']:
              if name not in html:
                  raise SystemExit(f'First-paint theme stylesheet missing from index.html: {name}')
          if 'portal-theme.css' in runtime or ('gc-theme-style' in runtime and "createElement('link')" in runtime):
              raise SystemExit('Authenticated runtime must not inject visually critical theme CSS after paint.')
          if 'prefers-color-scheme: dark' not in theme_bootstrap or 'gc-portal-theme' not in theme_bootstrap:
              raise SystemExit('Theme bootstrap must resolve saved/system theme before paint.')

          if 'overflow-y:auto' in mobile.replace(' ', ''):
              raise SystemExit('Mobile left navigation must not be vertically scrollable.')
          if "createElement('style')" in mobile or 'createElement("style")' in mobile:
              raise SystemExit('mobile-nav-safe.js must not inject CSS.')
          if 'MutationObserver' in mobile:
              raise SystemExit('Mobile hamburger controller must not use MutationObserver.')
          if "['schedule', '▦', 'Schedule']" not in mobile:
              raise SystemExit('Schedule must remain a first-class mobile navigation destination.')
          if 'mobileMenu?.addEventListener' in app or "document.querySelector('.mobile-menu')" in app:
              raise SystemExit('app.js must not own the hamburger; mobile-nav-safe.js is the sole controller.')
          if "classList.toggle('mobile-nav-open'" in app or 'classList.toggle("mobile-nav-open"' in app:
              raise SystemExit('app.js must not restore the legacy body-lock mobile state.')
          if 'sidebarBackdrop' in app or ("createElement('button')" in app and 'sidebar-backdrop' in app):
              raise SystemExit('app.js must not recreate the retired full-screen mobile backdrop.')
          if 'hardening.css' in app:
              raise SystemExit('app.js must not dynamically inject hardening.css.')
          if 'window.GotCrackedDiagnostics = diagnostics' not in app or 'unhandledrejection' not in app:
              raise SystemExit('Global live diagnostics must remain available.')
          if '.gc-diagnostic-stack' not in release or 'data-gc-copy-diagnostic' not in app:
              raise SystemExit('Diagnostic toast UI or copyable reference is missing.')

          if 'attributes: true' in final_js or "attributeFilter: ['class'" in final_js:
              raise SystemExit('portal-v1-final.js must not globally observe class/attribute mutations.')
          if 'childList: true' not in final_js:
              raise SystemExit('portal-v1-final.js should observe inserted operational DOM only.')

          script_refs = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)
          script_files = [ref.split('?',1)[0] for ref in script_refs]
          critical = ['theme-bootstrap.js','supabase.js','discord-integration.js','workflow.js','app.js','mobile-nav-safe.js','portal-runtime-loader.js']
          for name in critical:
              if name not in script_files:
                  raise SystemExit(f'Missing critical shell script: {name}')
          heavy = ['leads.js','portal-live.js','workforce.js','analytics.js','shipping.js','inventory-audit.js','operations-v1-core.js','schedule-board.js','time-clock.js']
          leaked = [name for name in heavy if name in script_files]
          if leaked:
              raise SystemExit('Heavy operational scripts must load after authentication: ' + ', '.join(leaked))

          required_runtime = [
              'analytics.js','shipping.js','inventory-audit.js','operations-v1-core.js',
              'training-store-guard.js','operations-v1-arrival.js','portal-v1-polish.js',
              'intake-profile-validation-fix.js','portal-v1-final.js','master-directory.js',
              'directory-advanced.js','time-clock.js','schedule-board.js','schedule-print.js',
              'sales-ops.js','dashboard-rail.js','checkout-receipts.js','reconciliation-center.js'
          ]
          for name in required_runtime:
              if name not in runtime:
                  raise SystemExit(f'Authenticated runtime loader missing: {name}')
          if runtime.find('operations-v1-core.js') > runtime.find('intake-profile-validation-fix.js'):
              raise SystemExit('Portal v1.1 profile validation must load after operations-v1-core.js.')
          if "schedule: ['schedule-board.js','schedule-print.js']" not in runtime:
              raise SystemExit('Schedule and its print action must remain view-scoped.')
          for retired in ['workforce.js','leads.js','portal-live.js','payment-center.js']:
              if f"'{retired}'" in runtime or f'"{retired}"' in runtime:
                  raise SystemExit(f'Retired runtime must not load in production: {retired}')

          required_release_fragments = [
              '.sidebar.gc-mobile-nav-ready>nav:not(.gc-mobile-nav)',
              '.sidebar>.gc-mobile-nav',
              '.sidebar-backdrop{display:none!important}',
              '.v1-drawer-backdrop',
              'background:transparent!important',
              '.v1-workflow-panel',
              'body.v1-overlay-open,body.v1-workflow-open',
              '#dashboard>.v1-dashboard-grid{display:none!important}',
              '.page-heading .subtle{display:none!important}',
              '.gc-dir-head p:not(.eyebrow){display:none!important}'
          ]
          for fragment in required_release_fragments:
              if fragment not in release:
                  raise SystemExit(f'Release CSS invariant missing: {fragment}')

          realtime_tables = ['leads','repair_tickets','customers','devices','intake_sessions','work_order_items','ticket_events']
          for table in realtime_tables:
              if table not in operations or table not in migration:
                  raise SystemExit(f'Cross-user realtime coverage missing for {table}.')
          if 'queueRealtimeReload' not in operations or 'realtimeReloading' not in operations:
              raise SystemExit('Operational realtime refresh must remain debounced and single-flight.')
          if 'client.realtime.setAuth(persisted.access_token)' not in supabase_js:
              raise SystemExit('Storage-first auth restore must pass its token to Realtime.')
          if 'await client.realtime.setAuth(session.access_token)' not in operations:
              raise SystemExit('Realtime subscription must authenticate before channel join.')
          if 'setInterval' not in operations or 'visibilitychange' not in operations:
              raise SystemExit('Realtime must retain an authoritative refresh fallback.')

          required_profile_fields = ['first_name','last_name','phone','address_line_1','city','state','postal_code']
          for field in required_profile_fields:
              if f"'{field}'" not in intake_profile:
                  raise SystemExit(f'Portal v1.1 intake profile guard missing required field: {field}')
          for optional in ['contact_phone','email']:
              if f"'{optional}'" not in intake_profile:
                  raise SystemExit(f'Portal v1.1 intake profile guard missing optional field declaration: {optional}')
          if 'First name, last name, primary phone, and full mailing address are required.' not in intake_profile:
              raise SystemExit('Portal v1.1 required-profile policy copy is missing.')
          if 'event.stopImmediatePropagation()' not in intake_profile:
              raise SystemExit('Portal v1.1 intake validation must block the legacy step handler when required data is incomplete.')

          for status_class in ['status-red','status-yellow','status-green','status-blue']:
              if status_class not in directory:
                  raise SystemExit(f'Master Directory status mapping missing {status_class}.')
          if 'linear-gradient(90deg,#d9463d,#e6ad32 58%,#2daa68)' not in sales_css or 'is-over-goal .gc-sales-progress' not in sales_css:
              raise SystemExit('Compact predictive sales-goal progress bar invariant missing.')
          for token in ['gc-sales-progress','external_expected_cents','internal_sales_cents','goal_confidence','openStartDay','openCloseout']:
              if token not in sales:
                  raise SystemExit(f'Premium sales/reconciliation runtime missing: {token}')

          if 'function sundayOf' not in schedule:
              raise SystemExit('Schedule must use a Sunday-Saturday work week.')
          if schedule.find('const state =') < schedule.find('const dateOnly ='):
              raise SystemExit('Schedule state must initialize after date helpers to prevent startup TDZ failures.')
          for rpc in ['get_schedule_management_summary','get_staff_schedule_week','get_schedule_actuals']:
              if rpc not in schedule:
                  raise SystemExit(f'Schedule data boundary missing RPC: {rpc}')
          if "client.rpc('time_clock_action'" not in timeclock or "client.rpc('get_time_clock_state'" not in timeclock:
              raise SystemExit('Dashboard time clock must use authoritative database RPCs.')
          if 'id="schedule"' not in html or 'id="dashboard-time-clock"' not in html:
              raise SystemExit('Schedule or dashboard time-clock shell is missing.')
          if 'id="sidebar-time-clock"' in html:
              raise SystemExit('Retired sidebar time clock must not return; dashboard utility rail owns the time clock.')
          for token in ['id="gc-dashboard-rail"','id="gc-dashboard-sales-slot"','id="gc-dashboard-appointments"','id="gc-dashboard-day-controls"']:
              if token not in html:
                  raise SystemExit(f'Dashboard utility rail shell missing: {token}')

          if 'schedule-print.html' not in schedule_print or 'gc-schedule-print:' not in schedule_print:
              raise SystemExit('Schedule print action must open the dedicated print document.')
          if '@page{size:letterlandscape' not in schedule_print_css.replace(' ',''):
              raise SystemExit('Schedule print template must target Letter landscape paper.')
          if 'window.print()' not in schedule_print_page or 'schedule-print-table' not in schedule_print_page:
              raise SystemExit('Dedicated printable schedule rendering is incomplete.')

          print('Portal v1.1 architecture checks passed.')
