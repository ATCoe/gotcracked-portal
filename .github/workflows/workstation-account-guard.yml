name: Shared Workstation Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workstation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse workstation runtime
        run: |
          node --check workstation-mode.js
          node --check operator-pin.js
          node --check portal-runtime-loader.js
      - name: Verify shared account boundary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const runtime=fs.readFileSync('portal-runtime-loader.js','utf8');
          const mode=fs.readFileSync('workstation-mode.js','utf8');
          const pins=fs.readFileSync('operator-pin.js','utf8');
          const migration=fs.readFileSync('supabase/migrations/0075_shared_front_desk_workstation.sql','utf8');
          const pinMigration=fs.readFileSync('supabase/migrations/0076_human_operator_pins_and_reset_dm.sql','utf8');
          const dmRoute=fs.readFileSync('supabase/migrations/0077_operator_pin_reset_dm_route.sql','utf8');
          const dmWorker=fs.readFileSync('supabase/functions/operator-pin-reset-dm/index.ts','utf8');
          if(!runtime.includes("'workstation-mode.js'")) throw new Error('Workstation mode must load after authentication.');
          for(const token of ['shared_workstation','Basic workflow only','gc-workstation-hidden','ALLOWED_VIEWS','operator-pin.js']) {
            if(!mode.includes(token)) throw new Error(`Workstation runtime missing ${token}`);
          }
          for(const token of [
            "account_type text not null default 'staff'",
            "p.account_type='shared_workstation'",
            "'repairs.intake'",
            "'ready_pickup.checkout'",
            "get_employee_recognition",
            "get_schedule_planning_summary",
            "get_staff_schedule_week",
            "get_timesheet_week"
          ]) {
            if(!migration.includes(token)) throw new Error(`Workstation data boundary missing ${token}`);
          }
          for(const token of ['staff_operator_pins','extensions.crypt','verify_workstation_operator_pin','request_operator_pin_reset','4 hours','5 minutes','operator_pin_reset']) {
            if(!pinMigration.includes(token)) throw new Error(`Operator PIN data boundary missing ${token}`);
          }
          for(const token of ['Workstation PIN','Forgot PIN?','PIN setup required','get_my_operator_pin_status','verify_workstation_operator_pin','Reset PIN & DM employee']) {
            if(!pins.includes(token)) throw new Error(`Operator PIN UI missing ${token}`);
          }
          if(!dmRoute.includes('operator-pin-reset-dm')) throw new Error('Operator PIN reset must route to the Marlon DM worker.');
          if(!dmWorker.includes('Marlon · Front Desk PIN reset')||!dmWorker.includes('never ask you to send your PIN')) throw new Error('Marlon PIN reset DM safety copy is missing.');
          if(migration.includes("'timeclock.use',")) throw new Error('Shared workstation must never receive time-clock access.');
          if(pinMigration.includes('pin_hash text not null')) throw new Error('Reset state must allow a null PIN hash.');
          console.log('Shared workstation and human operator PIN boundaries are present.');
          NODE
